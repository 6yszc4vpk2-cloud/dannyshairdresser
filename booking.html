<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Online | Danny's Hairdresser</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: #eee;
        }

        header {
            background: #000;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #D4AF37;
        }

        header h1 {
            margin: 0;
            font-size: 26px;
            color: #D4AF37;
        }

        nav a {
            color: #fff;
            margin-left: 20px;
            text-decoration: none;
            font-size: 16px;
        }

        .booking-container {
            max-width: 500px;
            margin: 50px auto;
            background: #000;
            padding: 30px;
            border-radius: 12px;
            border: 2px solid #D4AF37;
            box-shadow: 0 0 20px rgba(212,175,55,0.3);
        }

        .booking-container h2 {
            text-align: center;
            font-size: 32px;
            margin-bottom: 20px;
            background: linear-gradient(to right, #D4AF37, #C9A23F);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        label {
            font-size: 18px;
            margin-top: 15px;
            display: block;
            color: #D4AF37;
        }

        select, input {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            border-radius: 8px;
            border: 1px solid #D4AF37;
            background: #222;
            color: #eee;
            font-size: 16px;
            box-sizing: border-box;
        }

        /* Make date & time perfectly aligned */
        .row {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }

        .row input {
            flex: 1;
        }

        .btn {
            display: block;
            margin-top: 25px;
            background: #D4AF37;
            padding: 14px;
            text-align: center;
            border-radius: 8px;
            color: #000;
            font-weight: bold;
            text-decoration: none;
            font-size: 18px;
        }

        .whatsapp-btn {
            background: #25D366;
            color: #000;
            margin-top: 15px;
        }

        footer {
            background: #000;
            color: #D4AF37;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            border-top: 2px solid #D4AF37;
        }
    </style>
</head>
<body>

<header>
    <h1>💈 Danny's Hairdresser</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<div class="booking-container">
    <h2>Book Your Appointment</h2>

    <label>Service</label>
    <select id="service">
        <option>Classic Cut – €25</option>
        <option>Skin Fade – €30</option>
        <option>Buzz Cut – €20</option>
        <option>Beard Trim – €15</option>
        <option>Beard Shape + Razor – €20</option>
        <option>Cut + Beard Combo – €40</option>
    </select>

    <div class="row">
        <div style="flex:1;">
            <label>Date</label>
            <input type="date" id="date">
        </div>

        <div style="flex:1;">
            <label>Time</label>
            <input type="time" id="time">
        </div>
    </div>

    <a class="btn" href="#" onclick="confirmBooking()">Confirm Booking</a>

    <a class="btn whatsapp-btn" href="https://wa.me/31627493067" target="_blank">📱 Book via WhatsApp</a>
</div>

<footer>
    Danny's Hairdresser — Amstel, Amsterdam<br>
    © 2026 All Rights Reserved
</footer>

<script>
function confirmBooking() {
    const s = document.getElementById("service").value;
    const d = document.getElementById("date").value;
    const t = document.getElementById("time").value;

    if (!d || !t) {
        alert("Please select a date and time.");
        return;
    }

    alert("Booking confirmed:\n" + s + "\n" + d + " at " + t + "\nDanny will contact you shortly.");
}
</script>

</body>
</html>
